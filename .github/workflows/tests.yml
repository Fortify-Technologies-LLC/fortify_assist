name: tests

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  core:
    name: Core and accuracy harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: Accuracy gate (rules only)
        run: python -m fortify_eval.cli run fortify --min-accuracy 0.90 --max-wrong-action 0.005 --failures 0

  home-assistant:
    name: Home Assistant integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements_test_ha.txt
      - run: python -m pytest -q
        working-directory: tests_ha
