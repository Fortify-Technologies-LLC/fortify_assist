# Fortify Assist standing benchmark: the same phrases, questions and prompts, run on every version.
#
# Rules for this file:
# - Never change or reuse an id. To retire a phrase, set `retired: true`; to change one, add a new id.
# - Expectations describe what a great assistant should do in eval/houses/synthetic.yaml, not what the
#   current version happens to do. A phrase that fails today stays here until it passes.
# - Phrases use only the synthetic house (the Smiths' home). Nothing here may name a real home.
#
# Fields: id, group, text (or turns: [..] for a short conversation), room (the speaker's room, optional),
# expect: kind (action | answer | clarify | confirm | refuse | chat | no_action | any),
#         targets (exact set of entities acted on or answered about), service, data (fields that must match).
# `no_action` passes for anything that does not act. `any` records the reply without scoring it.

# ---- several lights at once, no device names -----------------------------------------------------
- {id: multi-01, group: multi, text: turn off all the lights in the workshop,
   expect: {kind: action, service: light.turn_off, targets: [light.workshop_a, light.workshop_b]}}
- {id: multi-02, group: multi, text: kill everything in the basement,
   expect: {kind: action, service: light.turn_off, targets: [light.bar_strip, light.workshop_a, light.workshop_b]}}
