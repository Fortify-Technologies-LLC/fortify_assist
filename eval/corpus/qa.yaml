# Questions about groups of devices. Expected answers are worked out by hand from
# eval/houses/synthetic.yaml, not by the code under test. ANSWER entities are the devices the
# answer is about: the matches for list/count/any, the counter-examples for a "no" to
# "are all ...", or the whole scope for a "yes".
- {id: qa-001, category: qa, utterance: which lights are on,
   expect: {kind: answer, entities: [light.living_room_ceiling, light.kitchen_counters, light.office_overhead, light.bar_strip, light.workshop_a, light.workshop_b, light.living_room_group]}}
